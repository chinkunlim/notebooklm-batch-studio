[project]
name = "notebooklm-batch-studio"
version = "0.1.0"
description = "Batch-upload PDFs in a folder to Gemini Notebook (NotebookLM), generate per-PDF audio overviews, 30-question quizzes and infographics, rename and download the outputs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "notebooklm-py[browser]>=0.8.5",
    "reportlab>=5.0.1",
    "pypdf>=6.21.1",
    "tomli>=2.5.0",
    "watchdog>=4.0.0",
    "fastapi>=0.158.1",
    "uvicorn>=0.54.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "starlette>=1.9.0",
    "pillow>=13.0.0",
    "markdown>=3.11.2",
]  # add with `uv add <package>` (never `pip install`)

[project.scripts]
notebooklm-batch-studio = "notebooklm_batch_studio.entrypoints.cli:main"
notebooklm-batch-studio-web = "notebooklm_batch_studio.entrypoints.api:main"
notebooklm-batch-studio-mcp = "notebooklm_batch_studio.entrypoints.mcp_server:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11",
    "types-reportlab>=5.0.0.20261008",
    "types-markdown>=3.11.2.20261029",
]  # add with `uv add --dev <package>`

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Use uv's own downloaded Python (see .python-version), never the system / Homebrew one
python-preference = "only-managed"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Framework-managed files (updated by `agentctl update`) and non-Python folders are not linted here
extend-exclude = ["scripts", ".agents", "gas", "web", "legacy", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
strict = true
